<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <style>
    .box { fill:#e8f1ff; stroke:#2563eb; stroke-width:3; rx:16; }
    .db { fill:#ecfdf5; stroke:#059669; stroke-width:3; }
    .title { font:700 32px Arial; fill:#0f172a; }
    .label { font:600 22px Arial; fill:#0f172a; text-anchor:middle; }
    .small { font:18px Arial; fill:#334155; text-anchor:middle; }
    .arrow { stroke:#475569; stroke-width:4; marker-end:url(#arrow); }
  </style>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#475569"/></marker></defs>
  <text x="600" y="55" class="title" text-anchor="middle">Urban Furniture Accounting System</text>
  <rect x="60" y="220" width="190" height="130" class="box"/>
  <text x="155" y="270" class="label">User</text><text x="155" y="305" class="small">Browser</text>
  <rect x="350" y="190" width="220" height="190" class="box"/>
  <text x="460" y="245" class="label">Frontend</text><text x="460" y="280" class="small">React + Vite</text><text x="460" y="315" class="small">Forms and pages</text><text x="460" y="350" class="small">Axios + JWT</text>
  <rect x="670" y="190" width="220" height="190" class="box"/>
  <text x="780" y="245" class="label">Backend API</text><text x="780" y="280" class="small">Express</text><text x="780" y="315" class="small">Routes and controllers</text><text x="780" y="350" class="small">Business rules</text>
  <path d="M250 285 H350" class="arrow"/><path d="M570 285 H670" class="arrow"/>
  <rect x="960" y="205" width="180" height="160" class="db"/>
  <text x="1050" y="260" class="label">Database</text><text x="1050" y="295" class="small">Prisma ORM</text><text x="1050" y="330" class="small">PostgreSQL</text>
  <path d="M890 285 H960" class="arrow"/>
  <text x="600" y="485" class="small">Data moves as JSON over REST APIs.</text>
  <text x="600" y="525" class="small">Validated transactions are stored in relational tables.</text>
</svg>
