<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <style>
    .box { fill:#fef3c7; stroke:#d97706; stroke-width:3; rx:16; }
    .secure { fill:#ede9fe; stroke:#7c3aed; stroke-width:3; rx:16; }
    .title { font:700 32px Arial; fill:#0f172a; }
    .label { font:600 21px Arial; fill:#0f172a; text-anchor:middle; }
    .small { font:18px Arial; fill:#334155; text-anchor:middle; }
    .arrow { stroke:#475569; stroke-width:4; marker-end:url(#arrow); }
  </style>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#475569"/></marker></defs>
  <text x="600" y="55" class="title" text-anchor="middle">Login and Security Flow</text>
  <rect x="55" y="220" width="190" height="130" class="box"/><text x="150" y="270" class="label">Login page</text><text x="150" y="310" class="small">ID + password</text>
  <rect x="330" y="190" width="220" height="190" class="secure"/><text x="440" y="245" class="label">Auth API</text><text x="440" y="285" class="small">Validate input</text><text x="440" y="320" class="small">Check password</text><text x="440" y="355" class="small">Create JWT</text>
  <rect x="635" y="220" width="190" height="130" class="secure"/><text x="730" y="270" class="label">Role check</text><text x="730" y="310" class="small">ADMIN / STAFF / USER</text>
  <rect x="910" y="190" width="230" height="190" class="box"/><text x="1025" y="245" class="label">Protected pages</text><text x="1025" y="285" class="small">JWT on requests</text><text x="1025" y="320" class="small">401 redirects</text><text x="1025" y="355" class="small">to login</text>
  <path d="M245 285 H330" class="arrow"/><path d="M550 285 H635" class="arrow"/><path d="M825 285 H910" class="arrow"/>
  <text x="600" y="485" class="small">The token is stored in localStorage and attached by Axios.</text>
  <text x="600" y="525" class="small">Backend middleware decides which actions each role can perform.</text>
</svg>
