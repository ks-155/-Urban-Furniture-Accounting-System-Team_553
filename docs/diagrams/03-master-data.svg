<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <style>
    .box { fill:#e0f2fe; stroke:#0284c7; stroke-width:3; rx:16; }
    .data { fill:#f0fdf4; stroke:#16a34a; stroke-width:3; rx:16; }
    .title { font:700 32px Arial; fill:#0f172a; }
    .label { font:600 21px Arial; fill:#0f172a; text-anchor:middle; }
    .small { font:18px Arial; fill:#334155; text-anchor:middle; }
    .arrow { stroke:#475569; stroke-width:4; marker-end:url(#arrow); }
  </style>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#475569"/></marker></defs>
  <text x="600" y="55" class="title" text-anchor="middle">Master Data Flow</text>
  <rect x="50" y="190" width="220" height="190" class="box"/><text x="160" y="245" class="label">React forms</text><text x="160" y="285" class="small">Contacts</text><text x="160" y="320" class="small">Products</text><text x="160" y="355" class="small">Accounts</text>
  <rect x="350" y="220" width="190" height="130" class="box"/><text x="445" y="270" class="label">Axios</text><text x="445" y="310" class="small">POST / PUT / GET</text>
  <rect x="620" y="190" width="220" height="190" class="box"/><text x="730" y="245" class="label">Controllers</text><text x="730" y="285" class="small">Validate fields</text><text x="730" y="320" class="small">Check permissions</text><text x="730" y="355" class="small">Save records</text>
  <rect x="920" y="220" width="220" height="130" class="data"/><text x="1030" y="270" class="label">PostgreSQL</text><text x="1030" y="310" class="small">Reference tables</text>
  <path d="M270 285 H350" class="arrow"/><path d="M540 285 H620" class="arrow"/><path d="M840 285 H920" class="arrow"/>
  <path d="M920 340 H270" class="arrow"/>
  <text x="600" y="485" class="small">Master data supplies the choices used by purchase and sales forms.</text>
  <text x="600" y="525" class="small">Example: a purchase order selects one vendor and many products.</text>
</svg>
